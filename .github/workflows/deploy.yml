name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ \
            libpq-dev libcurl4-openssl-dev libssl-dev \
            ca-certificates

      - name: Restore FetchContent cache
        uses: actions/cache@v4
        with:
          path: .deps
          key: fetchcontent-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: fetchcontent-

      - name: Build server binary
        run: make build-server

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Create deployment tarball
        run: |
          tar -czf anjeer-deploy.tar.gz \
            build/server/server \
            config/prod.json \
            db/migrations \
            frontend/dist \
            nginx/anjeer.conf

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          echo "$EC2_SSH_KEY" > /tmp/ec2_key
          chmod 600 /tmp/ec2_key

          mkdir -p ~/.ssh
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          scp -i /tmp/ec2_key \
            anjeer-deploy.tar.gz \
            ubuntu@$EC2_HOST:/tmp/anjeer-deploy.tar.gz

          ssh -i /tmp/ec2_key ubuntu@$EC2_HOST << 'REMOTE'
            set -euo pipefail

            cd /tmp
            tar -xzf anjeer-deploy.tar.gz

            sudo systemctl stop anjeer

            sudo cp build/server/server /opt/anjeer/anjeer_server
            sudo cp config/prod.json /opt/anjeer/config/prod.json

            sudo mkdir -p /opt/anjeer/db/migrations
            sudo rsync -a --delete db/migrations/ /opt/anjeer/db/migrations/

            sudo rm -rf /opt/anjeer/dist
            sudo cp -r frontend/dist /opt/anjeer/dist

            sudo chown -R anjeer:anjeer /opt/anjeer
            sudo systemctl start anjeer

            sudo cp nginx/anjeer.conf /etc/nginx/sites-enabled/anjeer
            sudo nginx -t && sudo systemctl reload nginx

            sleep 5
            curl -f http://localhost:10000/health
          REMOTE
