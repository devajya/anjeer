[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "anjeer"
version = "0.1.0"
description = "CLI for the Anjeer trading game — find, create and join API-mode lobbies"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "devajya" }]
keywords = ["anjeer", "trading", "game", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "click>=8.0",
    "requests>=2.28",
    "websockets>=12",
]

[project.urls]
Homepage   = "https://anjeer.duckdns.org"
Repository = "https://github.com/devajya/anjeer"

[project.scripts]
anjeer = "anjeer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
anjeer = ["templates/*"]
