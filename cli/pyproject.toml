[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "anjeer"
version = "0.1.0"
description = "CLI for the Anjeer trading game — find, create and join API-mode lobbies"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "requests>=2.28",
]

[project.scripts]
anjeer = "anjeer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
